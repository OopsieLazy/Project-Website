  <!-- Header logo: "ZN" in the Sacramento script (R1, owner's pick). The letters are outlines
       from the Sacramento font (SIL Open Font License 1.1), so visitors download no font.
       To use your own logo: replace this file, keep the name logo.svg (a .png works too,
       then change src in the six pages). -->
  <style>
    /* Pine on the Day header. An SVG used as an image can't read the site's CSS tokens,
       but it does see the page's color-scheme, which the theme picker sets (D22),
       so the dark themes (Lantern, Moss) get the night accent.
       The stroke (same color as the fill) thickens the thin pen line so it reads at 48px.
       This file is XML: never write a tag name in angle brackets in this block */
    path { color: #385850; fill: currentColor; stroke: currentColor; stroke-width: 102; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { path { color: #8FD3E8; } }
  </style>
